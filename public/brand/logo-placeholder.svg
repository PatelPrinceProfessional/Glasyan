<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none" class="glasyan-logo-svg">
  <defs>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A8B3" />
      <stop offset="100%" stop-color="#008C95" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#7FC4C9" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#008C95" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#005A61" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Droplet Symbol -->
  <g id="drop" transform="translate(18, 12)">
    <path 
      d="M14 2 C14 2, 2 18, 2 26 C2 33.732 8.268 40 16 40 C23.732 40 30 33.732 30 26 C30 18, 18 2, 14 2 Z" 
      fill="url(#dropGrad)" 
      stroke="#005A61" 
      stroke-width="1.2"
      stroke-linejoin="round"
    />
    <!-- Droplet inner reflection highlight -->
    <path 
      d="M10 18 C8 21, 7 24, 7 28 C7 31, 9 34, 12 35" 
      stroke="#FFFFFF" 
      stroke-width="1.4" 
      stroke-linecap="round" 
      opacity="0.65" 
    />
  </g>

  <!-- Wave Swoosh -->
  <g id="wave" transform="translate(6, 46)">
    <path 
      d="M0 14 C12 6, 26 22, 42 12 C52 6, 56 16, 68 10 C74 7, 82 18, 92 12" 
      stroke="url(#waveGrad)" 
      stroke-width="2.4" 
      stroke-linecap="round" 
      fill="none" 
    />
    <path 
      d="M10 18 C22 12, 34 26, 48 16 C58 9, 66 18, 78 12" 
      stroke="#7FC4C9" 
      stroke-width="1.2" 
      stroke-linecap="round" 
      stroke-opacity="0.5" 
      fill="none" 
    />
  </g>

  <!-- Wordmark "Glasyan" -->
  <g id="wordmark" transform="translate(68, 48)">
    <text 
      x="0" 
      y="0" 
      font-family="'Melodrama', 'Didot', 'Bodoni MT', 'Cinzel', 'Georgia', serif" 
      font-size="36" 
      font-weight="500" 
      letter-spacing="0.08em" 
      fill="#0A2E32"
    >
      GLASYAN
    </text>
    <text 
      x="2" 
      y="14" 
      font-family="'Satoshi', 'Inter', -apple-system, sans-serif" 
      font-size="7.5" 
      font-weight="500" 
      letter-spacing="0.32em" 
      fill="#008C95"
    >
      HAIR ESSENCE &amp; ALCHEMY
    </text>
  </g>
</svg>
